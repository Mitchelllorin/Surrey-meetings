<style>
/* Layout: one column. Tabs (Meetings / People / Help). Meetings = next card, day strip, area + fellowship chips, list. */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#15232b; --muted:#5b6b70; --line:#d5dcdb;
  --accent:#0f6e6a; --accent-ink:#ffffff; --soft:#dcecea; --warn:#9a5b00; --warnsoft:#f6ead6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172225; --ink:#e6eeee; --muted:#93a4a6; --line:#2a3a3d;
  --accent:#4cc1b8; --accent-ink:#06201f; --soft:#1d3634; --warn:#e5a54a; --warnsoft:#33291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172225; --ink:#e6eeee; --muted:#93a4a6; --line:#2a3a3d;
  --accent:#4cc1b8; --accent-ink:#06201f; --soft:#1d3634; --warn:#e5a54a; --warnsoft:#33291a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{padding-top:20px;display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.05;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:0}
button{font-family:var(--body);color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{min-height:44px;border:0;border-radius:9px;background:none;font-weight:700;font-size:.95rem;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
section[data-view]{display:flex;flex-direction:column;gap:14px}
.next{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.next .eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.next .name{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.15}
.next .when{font-variant-numeric:tabular-nums}
.next a{color:var(--accent-ink);font-weight:700}
.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.days button small{font-weight:400;font-size:.65rem;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] small{color:var(--bg)}
.days button.today{border:2px solid var(--accent)}
.days button small{font-variant-numeric:tabular-nums}
.filter{display:flex;flex-direction:column;gap:6px}
.filter .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:4.9rem 1fr 48px;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.row.past{opacity:.45}
.row.now .time{color:var(--accent)}
.time{font-variant-numeric:tabular-nums;font-weight:700;padding-top:1px}
.time small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.info .n{font-weight:700}
.where{font-size:.85rem;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted)}
.tag{font-weight:700;font-size:.72rem;letter-spacing:.05em;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--ink)}
.flag{color:var(--warn);font-weight:700}
.meta a{color:var(--accent);font-weight:700}
.zoom{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.star{width:48px;height:48px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:1.4rem;border-radius:10px}
.star[aria-pressed="true"]{color:var(--accent)}
.empty{color:var(--muted);padding:16px 0;margin:0}
.notice{font-size:.85rem;border-left:3px solid var(--warn);padding:4px 10px;color:var(--muted);margin:0}
.key{font-size:.85rem;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.key b{color:var(--ink)}
.src{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.src a,footer a{color:var(--accent)}
/* People */
.motto{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0}
.person{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.person .nm{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.person .num{font-variant-numeric:tabular-nums;font-size:1.05rem;user-select:all}
.chk{font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px}
.chk.no{background:var(--warnsoft);color:var(--warn)}
.chk.ok{background:var(--soft);color:var(--accent)}
.acts{display:flex;gap:6px}
.btn{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.edit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.edit input{flex:1 1 140px;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit}
.addform{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.addform input{flex:1 1 140px;min-width:0;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit}
/* Help */
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .what{font-size:.85rem;color:var(--muted)}
.line .num{font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:700;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.days button,.chips button,.tabs button{transition:background .15s,color .15s}}
.confirm{display:flex;flex-direction:column;gap:8px;padding:12px;margin-top:10px;border:1px solid var(--warn);border-radius:12px;background:var(--warnsoft)}
.btn.danger{background:var(--warn);color:var(--surface);border-color:var(--warn)}
</style>
